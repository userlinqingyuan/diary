<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📔 日记</title>
    <!-- 中文字体 -->
    <link href="https://fonts.loli.net/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <!-- 英文字体 -->
    <link href="https://fonts.loli.net/css2?family=Nothing+You+Could+Do&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f0e6;
            background-image: url(https://www.transparenttextures.com/patterns/paper-fibers.png);
            font-family: 'Nothing You Could Do', 'Ma Shan Zheng', cursive, serif;
            text-shadow: 0.6px 0.6px 0px rgba(0,0,0,0.12);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .cover {
            max-width: 680px;
            width: 100%;
            background: rgba(255, 252, 245, 0.88);
            backdrop-filter: blur(4px);
            padding: 50px 45px 55px;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            border: 1px solid #e5d9c4;
            text-align: center;
            position: relative;
            transition: box-shadow 0.3s;
        }

        .cover:hover {
            box-shadow: 0 16px 56px rgba(0, 0, 0, 0.12);
        }

        /* 装饰角标 */
        .cover::before {
            content: "❧";
            position: absolute;
            top: 16px;
            right: 24px;
            font-size: 2.2em;
            color: #dac09a;
            opacity: 0.5;
            font-family: serif;
        }
        .cover::after {
            content: "❧";
            position: absolute;
            bottom: 16px;
            left: 24px;
            font-size: 2.2em;
            color: #dac09a;
            opacity: 0.5;
            font-family: serif;
        }

        /* 装饰线 */
        .divider {
            width: 60px;
            height: 2px;
            background: #dac09a;
            margin: 16px auto 20px;
            border-radius: 2px;
        }

        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 3.2em;
            font-weight: 400;
            color: #4a3728;
            letter-spacing: 6px;
            margin-bottom: 4px;
        }

        .sub-en {
            font-family: 'Nothing You Could Do', cursive;
            font-size: 1.3em;
            color: #8a7a66;
            letter-spacing: 2px;
        }

        .sub-zh {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.1em;
            color: #b09b84;
            margin-top: 2px;
            letter-spacing: 3px;
        }

        .entry {
            margin-top: 30px;
            padding: 16px 20px;
            background: #fcf9f3;
            border-left: 4px solid #dac09a;
            border-radius: 0 8px 8px 0;
            text-align: left;
            font-size: 1.15em;
            color: #4a3728;
            transition: background 0.2s;
        }
        .entry:hover {
            background: #f8f1e6;
        }
        .entry a {
            text-decoration: none;
            color: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .entry a .arrow {
            font-size: 1.4em;
            color: #b09b84;
            transition: transform 0.2s;
        }
        .entry a:hover .arrow {
            transform: translateX(4px);
        }

        .footer-note {
            margin-top: 35px;
            font-size: 0.85em;
            color: #b09b84;
            border-top: 1px solid #e5d9c4;
            padding-top: 18px;
            font-family: 'Nothing You Could Do', cursive;
            letter-spacing: 0.5px;
        }

        @media (max-width: 600px) {
            .cover { padding: 30px 20px 35px; }
            h1 { font-size: 2.4em; letter-spacing: 4px; }
            .sub-en { font-size: 1.0em; }
            .entry { font-size: 1.0em; }
            .cover::before, .cover::after { font-size: 1.6em; top: 12px; right: 16px; bottom: 12px; left: 16px; }
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="divider"></div>
        <h1><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#785e45"><path d="M240-80q-33 0-56.5-23.5T160-160v-640q0-33 23.5-56.5T240-880h480q33 0 56.5 23.5T800-800v640q0 33-23.5 56.5T720-80H240Zm0-80h480v-640h-80v280l-100-60-100 60v-280H240v640Zm0 0v-640 640Zm200-360 100-60 100 60-100-60-100 60Z"/></svg> 日记</h1>
        <div class="sub-en">— daily pages —</div>
        <div class="sub-zh">每次落笔都是一次抵达</div>
        <div class="divider"></div>

        <!-- 入口链接：指向你的样稿目录或具体日记 -->

                <span class="arrow">→</span>

    </div>
</body>
